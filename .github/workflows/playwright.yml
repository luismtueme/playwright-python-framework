name: Playwright

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. The summary job asks for pull-request writes.
permissions:
  contents: read

# A newer push to the same PR cancels the older run. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python -m utils.lint_tests
      - run: uv run python -m utils.generate_api_types --check
      - run: uv run pytest unit --cov=config --cov=demo_app --cov=utils --cov=contracts --cov-fail-under=90 --cov-report=term-missing
      - name: Dependency audit
        run: |
          uv export --frozen --no-dev --format requirements-txt --output-file /tmp/requirements.txt
          uvx pip-audit --requirement /tmp/requirements.txt

  # Pull requests only. Skipped on a push to main, which GitHub counts as passing
  # for the required Burn-in check.
  burn-in:
    name: Burn-in
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - name: Repeat changed tests
        env:
          CI: "true"
          HEADLESS: "true"
          RETRIES: "0"
        run: |
          files=$(uv run python -m utils.affected "origin/${{ github.base_ref }}")
          echo "$files"
          if [ "$files" = "ALL" ] || [ -z "$files" ]; then
            echo "No isolated test files to burn in."
            exit 0
          fi
          # shellcheck disable=SC2086
          uv run pytest $files --count 10 --reruns 0 -m "not visual"

  test-shard:
    name: Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: demo
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CI: "true"
      HEADLESS: "true"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: demo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - name: Sharded suite
        run: uv run pytest tests --splits 4 --group ${{ matrix.shard }} --junitxml=test-results/junit.xml -m "not visual"
      # Quarantine runs once, on shard 1. A failure is reported and does not fail the shard.
      - name: Run quarantined tests
        if: ${{ !cancelled() && matrix.shard == 1 }}
        continue-on-error: true
        env:
          RETRIES: "0"
        run: uv run python -m utils.run_quarantine --reruns 0
      - name: Leftover data
        if: ${{ !cancelled() }}
        run: uv run python -m utils.check_leftover_data
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-shard-${{ matrix.shard }}
          path: |
            test-results/report.json
            test-results/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  # Required check. The matrix jobs are named "Tests (shard N/4)", so this job
  # is the single status check called Tests.
  tests:
    name: Tests
    needs: test-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: report-shard-*
          path: reports
      - name: Require every shard report
        run: |
          count=$(find reports -name 'junit.xml' | wc -l)
          echo "Shard reports: $count"
          test "$count" -eq 4
      - name: Fail if any shard failed
        if: ${{ needs.test-shard.result != 'success' }}
        run: |
          echo "A test shard failed (result: ${{ needs.test-shard.result }})."
          exit 1

  visual:
    name: Visual
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
    env:
      CI: "true"
      HEADLESS: "true"
      IN_DOCKER: "true"
      PW_SUITE: visual
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: pip install --quiet uv
      - run: uv sync --frozen
      - name: Compare screenshots
        run: uv run python -m utils.visual
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/visual/__screenshots__/**/*-actual.png
          if-no-files-found: ignore
          retention-days: 14

  summary:
    name: Summary
    if: always() && github.event_name == 'pull_request'
    needs: [checks, burn-in, tests, visual]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: report-shard-*
          path: reports
      - name: Render summary
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          mapfile -t files < <(find reports -name report.json | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "<!-- playwright-summary -->" > /tmp/summary.md
            echo "### Playwright" >> /tmp/summary.md
            echo "No shard report was uploaded." >> /tmp/summary.md
          else
            uv run python -m utils.pr_summary "${files[@]}" > /tmp/summary.md
          fi
      - name: Comment on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- playwright-summary -->';
            const body = fs.readFileSync('/tmp/summary.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => (comment.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
